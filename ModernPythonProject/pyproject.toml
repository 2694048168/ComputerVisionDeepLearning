[project]
name = "Vision_Smart_Algorithm"
version = "1.1.0"
description = "A large-scale Computer Vision Smart Algorithm project"
authors = [{name = "Wei Li(Ithaca)", email = "weili_yzzcq@163.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.12.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
